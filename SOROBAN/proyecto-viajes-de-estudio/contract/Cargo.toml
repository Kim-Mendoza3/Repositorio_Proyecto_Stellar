[workspace]
members = [
    "contracts/smarttrip-core",
    "contracts/smarttrip-trip",
    "contracts/smarttrip-badge",
    "contracts/smarttrip-token",
    "contracts/smarttrip-reputation",
    "contracts/smarttrip-treasury",
]
resolver = "2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
